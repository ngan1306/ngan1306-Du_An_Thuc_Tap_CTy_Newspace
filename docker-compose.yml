services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: du-an-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      JWT_SECRET_KEY: change-this-secret
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: du-an-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped